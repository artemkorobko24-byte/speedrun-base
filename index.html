<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Base | FouxvFilm</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ffcc;
        }
        header h1 {
            margin: 0;
            color: #00ffcc;
            font-size: 28px;
            text-transform: uppercase;
        }
        header p {
            margin: 5px 0 0 0;
            color: #aaaaaa;
            font-size: 14px;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .game-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #00ffcc;
        }
        .game-card h2 {
            margin-top: 0;
            color: #ffffff;
        }
        .game-card p {
            color: #cccccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Speedrun Base</h1>
        <p>Незалежна база рекордів від FouxvFilm | Без тупих відхилень</p>
    </header>

    <div class="container">
        <div class="game-card">
            <h2>Granny (Всі версії)</h2>
            <p>База для офіційних сабмітів. Всі білди та спідран-категорії приймаються без обмежень.</p>
        </div>

        <div class="game-card">
            <h2>Word of Wonders</h2>
            <p>Глобальні таблиці лідерів. Від перших локацій до Єгипту і далі.</p>
        </div>
    </div>

</body>
</html>
