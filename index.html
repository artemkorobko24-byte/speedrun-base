<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Base | FouxvFilm</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; margin: 0; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; border-bottom: 3px solid #00ffcc; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; background: #ffffff; color: #000; border: none; border-radius: 5px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Speedrun Base</h1>
        <p>Альтернативна база рекордів</p>
        <button id="google-login-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20" alt="Google">
            Увійти через Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ВСТАВ СВІЙ КОД FIREBASE CONFIG СЮДИ:
        const firebaseConfig = {
            apiKey: "ТВІЙ_API_KEY",
            authDomain: "speedrun-tracker-d628c.firebaseapp.com",
            projectId: "speedrun-tracker-d628c",
            storageBucket: "speedrun-tracker-d628c.appspot.com",
            messagingSenderId: "ТВІЙ_ID",
            appId: "ТВІЙ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert("Успішний вхід! Привіт, " + result.user.displayName);
                })
                .catch((error) => {
                    console.error(error);
                    alert("Помилка входу: " + error.message);
                });
        });
    </script>
</body>
</html>
